# Cava raw ASCII output; no user files are created or overwritten.
[general]
bars = 32
framerate = 24
[input]
method = pipewire
source = auto
[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
