# Shipped UNLAUNCHED, and that is the point.
#
# hypridle watches ext_idle_notifier_v1, and so does the shell: Noctalia v5.4.1 runs its
# own idle behaviours from [idle.behavior.*] in ~/.config/noctalia/config.toml, which
# respect D-Bus and Wayland idle inhibitors. Starting both means two processes racing to
# lock, dim and suspend the same session, and nobody can tell from the screen which one
# won. So idle is configured in the shell, and this file exists for the case where the
# shell is not running at all.
#
# It declares no listener, so it owns no timer: only the two commands a session still
# needs without a shell. lock_cmd prefers the lock surface that is already up -- the
# same `pidof x || y` shape the hypridle manual's own example uses -- and falls back to
# hyprlock, which reads the hyprlock.conf next to this file.
#
# To use it instead of the shell's idle system, add `hypridle` to the exec_once list in
# .config/hypr/startup.lua *and* disable every [idle.behavior.*] entry in config.toml.
# Doing only the first is what causes the race.
#
# after_sleep_cmd is the hypridle manual's own remedy for a display that needs a key
# press to come back after resume, in the spelling this compositor can run: Hyprland
# v0.57.2 evaluates `hyprctl dispatch X` as Lua when the config provider is Lua, so the
# manual's legacy `dpms on` form is a syntax error here and hl.dsp.dpms is the dispatcher
# that exists. docs/UNVERIFIED.md LOCK-03 records that no compositor in this project's
# reach ever ran either spelling.

general {
    lock_cmd = pidof noctalia || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

