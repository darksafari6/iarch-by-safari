# GENERATED BY iArch. DO NOT EDIT. Change settings in iArch Settings.
# Source: data/design/tokens.json intensity=frosted, preset=data/design/presets/midnight-glass.json, motion=data/design/animations/smooth.json.
# Variables, types and defaults recorded in data/design/hyprlock.json (hyprlock (hyprwm) manual at hyprland-wiki main, fetched 2026-11-09).
# Edit the tokens, the preset or the geometry constants in iarch/cli/render_hyprlock.py, then run iarch-theme apply.
# hyprlock only warns about an unknown variable, so this file is generated and checked rather than hand-edited.

# The lock surface fades with the compositor's own blur contribution when the
# session animates at all, and hides the pointer: a cursor parked over a password
# field is a cursor in the way of the dots. fail_timeout is hyprlock's default,
# restated so the field's own fade_timeout and the UI reset cannot drift apart.
general {
    compositor_fade = true
    fail_timeout = 2000
    hide_cursor = true
    text_trim = true
}

# PAM only, with hyprlock's own module. Naming one would assert that
# /etc/pam.d/<module> exists on this machine; hyprlock falls back to "su" when it
# does not. On Arch, pambase's pam_faillock.so already locks the account for ten
# minutes after three failed unlocks.
auth {
    pam:enabled = true
}

# Durations are the animation preset's own fadeIn and fadeOut leaves, converted to the
# seconds hyprlock's animation keyword takes. The tokens' speed_multiplier is not
# applied: it scales Hyprland's tree through generated/animations.lua, and hyprlock has
# no multiplier, so scaling one side would make the lock screen disagree with the
# session it locks. With motion off there are no lines at all and enabled = false.
animations {
    enabled = true
    bezier = standard, 0.4, 0, 0.2, 1
    bezier = accelerate, 0.4, 0, 1, 1
    animation = fadeIn, 1, 0.12, standard
    animation = fadeOut, 1, 0.12, accelerate
}

# The desktop, captured when the lock starts and blurred by exactly the recipe the
# intensity uses for windows and panels: these are Hyprland's decoration:blur
# leaves, and hyprlock's manual says its blur options are taken from Hyprland.
# color is the fallback the manual describes for a path that cannot be read, so it
# is the palette's background at full opacity rather than a tint. A *live* blurred
# backdrop instead of a capture needs Hyprland's misc:session_lock_xray and
# misc:session_lock_blur; both are real v0.57.2 leaves and neither is enabled here,
# because they keep every workspace rendering underneath a locked session.
background {
    monitor = 
    path = screenshot
    color = rgba(11, 14, 26, 1.0)
    blur_passes = 3
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 1
    vibrancy = 0.2
    zindex = -1
}

# The frosted card. Only background blurs in hyprlock, so "frosted" here is a
# translucent surface colour over an already-blurred capture -- the shell's own
# panel recipe, minus a second blur pass it has no variable for. rounding is the
# tokens' panel radius in pixels; hyprlock has no percentage rounding and no shared
# radius scale.
shape {
    monitor = 
    size = 460, 170
    color = rgba(20, 24, 41, 0.34)
    rounding = 24
    border_size = 1
    border_color = rgba(51, 58, 88, 0.18)
    position = 0, 24
    halign = center
    valign = center
    zindex = 1
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(5, 7, 15, 1.0)
    shadow_boost = 0.36
}

# The three state colours are the palette's semantic accents: warning while PAM is
# being asked, danger when it refuses, primary when Caps Lock is on -- the same
# mapping the shell uses for a critical notification's border. hyprlock documents
# each as a gradient, and a gradient accepts one colour.
input-field {
    monitor = 
    size = 400, 90
    outline_thickness = 1
    outer_color = rgba(51, 58, 88, 0.18)
    inner_color = rgba(27, 32, 54, 0.48)
    font_color = rgba(230, 233, 248, 1.0)
    font_family = Inter
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <i>Type your password</i>
    check_color = rgba(251, 191, 36, 1.0)
    check_text = Checking…
    fail_color = rgba(251, 113, 133, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(139, 149, 255, 1.0)
    position = 0, -16
    halign = center
    valign = center
    zindex = 2
}

# $TIME and $DESC are hyprlock's own substitutions, so nothing on this screen runs
# a shell command. The manual's cmd[update:N] form spawns a process on a timer
# inside the lock surface and hangs the AsyncResourceGatherer if it never exits; a
# clock that costs nothing is worth more than one that proves a shell works.
label {
    monitor = 
    text = $TIME
    color = rgba(230, 233, 248, 1.0)
    font_size = 28
    font_family = Inter
    position = 0, 96
    halign = center
    valign = top
    zindex = 3
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(5, 7, 15, 1.0)
    shadow_boost = 0.36
}

label {
    monitor = 
    text = $DESC
    color = rgba(179, 186, 214, 1.0)
    font_size = 16
    font_family = Inter
    position = 0, 96
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor = 
    text = Enter to unlock · Esc clears the field
    color = rgba(179, 186, 214, 0.7)
    font_size = 12
    font_family = Inter
    position = 0, 128
    halign = center
    valign = center
    zindex = 3
}

