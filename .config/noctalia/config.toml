# GENERATED BY iArch. DO NOT EDIT. Change settings in iArch Settings.
# Source: data/design/tokens.json intensity=frosted, preset=data/design/presets/midnight-glass.json.
# Keys, enums and ranges verified against Noctalia v5.4.1; see data/design/noctalia.json.
# Edit the tokens, the preset or PROFILE in iarch/cli/render_noctalia.py, then run iarch-theme apply.

# Palette selection. source = custom points at palettes/<custom_palette>.json.
[theme]
mode = "dark"
shell_mode = "dark"
source = "custom"
custom_palette = "iarch-midnight"
sync_color_scheme = true
pure_black_dark = false

# Shell-wide appearance. Radii, borders and translucency come from the tokens.
[shell]
corner_radius_scale = 1.5
button_borders = false
input_borders = true
popup_borders = true
card_borders = true
show_close_buttons = true
popup_shadows = true
font_family = ""
time_format = "{:%H:%M}"
date_format = "%a, %x"
telemetry_enabled = false
settings_window_translucent = true
settings_show_advanced = false
settings_expand_all_groups = false
app_icon_colorize = false
clipboard_enabled = true
clipboard_confirm_clear_history = true

# Speed is motion.normal_ms measured against a 220 ms baseline.
[shell.animation]
enabled = true
speed = 1.0

# Panel shadow: the intensity's shadow alpha, or nothing when shadows are off.
[shell.shadow]
direction = "down"
alpha = 0.36

# Floating panels: launcher, control centre, session, polkit, wallpaper picker.
[shell.panel]
transparency_mode = "glass"
borders = true
border_color = "outline_variant"
border_width = 1.0
shadow = true
list_item_background = false
floating_layer = "overlay"
floating_offset = 8
open_near_click_control_center = true
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
polkit_placement = "floating"
launcher_position = "center"
clipboard_position = "center"
control_center_position = "top_right"
wallpaper_position = "center"
session_position = "center"
polkit_position = "center"

# Launcher layout and content. Its seven providers keep their built-in prefixes, so none is restated here.
[shell.launcher]
layout = "full"
width = 760
search_position = "bottom"
default_view = "recent"
categories = true
category_icons_only = false
show_navigation_labels = true
show_settings_button = true
show_session_button = true
show_icons = true
show_app_origin_indicator = true
compact = false
app_grid = false
show_app_actions = false
track_usage = true
sort_by_usage = true
ignore_mouse = false
pinned = []
fetch_exchange_rates = false
provider_prefix = "/"
auto_paste = "auto"

# The Alt+Tab overlay, opened by `noctalia msg window-switcher hold`.
[shell.window_switcher]
style = "carousel"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

# Bars live at the config root: order names them, [bar.<name>] configures each.
[bar]
order = ["default"]

[bar.default]
position = "top"
enabled = true
auto_hide = false
reserve_space = true
thickness = 40
background_opacity = 0.48
compositor_blur = true
border = "outline_variant"
border_width = 1.0
shadow = true
contact_shadow = false
radius_top_left = 24
radius_top_right = 24
radius_bottom_left = 24
radius_bottom_right = 24
margin_ends = 14
margin_edge = 8
padding = 12
widget_spacing = 8
scale = 1.0
font_scale = 1.0
capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.56
capsule_border = "outline_variant"
capsule_border_width = 1
capsule_radius = 16.0
start = ["launcher", "workspaces"]
center = ["clock"]
end = ["media", "tray", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "control-center", "session"]

# Dock geometry and magnification.
[dock]
enabled = true
position = "bottom"
active_monitor_only = false
icon_size = 44
main_axis_padding = 18
cross_axis_padding = 10
item_spacing = 8
background_opacity = 0.54
compositor_blur = true
border = "outline_variant"
border_width = 1.0
shadow = true
radius = 24
margin_ends = 0
margin_edge = 12
show_running = true
auto_hide = false
reserve_space = false
layer = "top"
active_scale = 1.05
inactive_scale = 0.9
magnification = true
magnification_scale = 1.18

# Control centre layout, its tabs and the Home shortcut row.
[control_center]
sidebar = "full"
sidebar_section = "compact"
width = 700
show_shortcut_labels = true
show_session_button = true
circular_avatar = true
show_avatar_border = true
hidden_tabs = []

# Calendar tab: the card on Home and the month view.
[control_center.calendar]
show_events_card = true
show_week_numbers = false
show_events_location = true
hide_past_events = true
past_events_threshold_minutes = 15

# Media tab. The visualizer follows the intensity's motion switch.
[control_center.media]
show_visualizer = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

# Notification toasts.
[notification]
enable_daemon = true
show_app_name = true
show_actions = true
position = "top_right"
layer = "top"
scale = 1.0
width = 380
offset_x = 16
offset_y = 16
follow_focused_output = false
monitors = []
collapse_on_dismiss = true
keep_dismissed_in_history = true
max_visible = 4
history_retention_hours = 168
background_opacity = 0.7
border = true
border_color = "outline_variant"
border_width = 1.0

# Shell sounds. Notification sounds are off by design.
[audio]
enable_sounds = true
enable_notification_sounds = false
enable_volume_sounds = true
enable_power_sounds = true
enable_screenshot_sounds = true
sound_volume = 0.38
sound_theme = "freedesktop"

# Idle behaviours. The shell watches ext_idle_notifier_v1 itself, so .config/hypr/hypridle.conf ships unlaunched rather than racing it.
[idle]
pre_action_fade_seconds = 2.0

# Fifteen minutes idle locks the session.
[idle.behavior.lock]
enabled = true
timeout = 900
action = "lock"

# One minute after that the monitors go off, and come back on their own when you return.
[idle.behavior.screen_off]
enabled = true
timeout = 960
action = "screen_off"

# The shell's own lock screen: the one this session shows whenever the shell is running, so hyprlock.conf is the fallback. One transition, chosen by name, because the shell picks a random one of whatever is listed.
[lockscreen]
enabled = true
lock_before_suspend = true
grace_period_seconds = 0
fingerprint = true
allow_empty_password = false
blurred_desktop = true
transition = ["fade"]
transition_duration = 100.0
edge_smoothness = 0.3
blur_intensity = 0.5
tint_intensity = 0.34
