name: Refresh complete iArch source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-full-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-independent-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest source files
        uses: actions/checkout@v4
        with:
          repository: darksafari6/minimaLinux
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out this independent repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: destination
          fetch-depth: 1

      - name: Replace repository contents with latest source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            source/ destination/

          while IFS= read -r -d '' file; do
            if grep -Iq . "$file"; then
              sed -i \
                -e 's#https://github.com/darksafari6/minimaLinux.git#https://github.com/darksafari6/iarch-by-safari.git#g' \
                -e 's#https://github.com/darksafari6/minimaLinux#https://github.com/darksafari6/iarch-by-safari#g' \
                -e 's#darksafari6/minimaLinux#darksafari6/iarch-by-safari#g' \
                -e 's#cd ./minimaLinux#cd ./iarch-by-safari#g' \
                -e 's#cd minimaLinux#cd iarch-by-safari#g' \
                "$file"
            fi
          done < <(find destination -type f -not -path '*/.git/*' -print0)

          rm -rf destination/.config/kitty/kitty-themes

          if ! grep -q 'standalone GitHub repository' destination/README.md; then
            python - <<'PY'
          from pathlib import Path
          p = Path("destination/README.md")
          text = p.read_text()
          marker = "</p>\n\n<div align=\"center\">"
          note = "</p>\n\n<p align=\"center\"><strong>iArch by Safari</strong> is maintained as a standalone GitHub repository, not as a fork of another GitHub repository.</p>\n\n<div align=\"center\">"
          if marker in text:
              text = text.replace(marker, note, 1)
          p.write_text(text)
          PY
          fi

      - name: Commit the full refreshed source
        working-directory: destination
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already synchronized with source."
            exit 0
          fi
          git commit -m "Refresh complete iArch source from latest minimaLinux code"
          git push origin HEAD:main
