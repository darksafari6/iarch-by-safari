name: Import complete minimaLinux source into iarch-by-safari

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-full-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing source repository
        uses: actions/checkout@v4
        with:
          repository: darksafari6/minimaLinux
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Check out the new independent repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 1

      - name: Copy the complete tracked source tree and assets
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-full-source.yml' \
            upstream/ target/

          # Update clone instructions to point to the new standalone repository.
          while IFS= read -r -d '' file; do
            if grep -Iq . "$file"; then
              sed -i \
                -e 's#https://github.com/darksafari6/minimaLinux.git#https://github.com/darksafari6/iarch-by-safari.git#g' \
                -e 's#darksafari6/minimaLinux#darksafari6/iarch-by-safari#g' \
                -e 's#cd ./minimaLinux#cd ./iarch-by-safari#g' \
                -e 's#cd minimaLinux#cd iarch-by-safari#g' \
                "$file"
            fi
          done < <(find target -type f -not -path '*/.git/*' -print0)

          # The upstream repository contains an orphaned gitlink without a
          # .gitmodules mapping. Do not turn it into a broken empty submodule.
          rm -rf target/.config/kitty/kitty-themes

          # Remove this one-time importer after it has completed.
          rm -f target/.github/workflows/import-full-source.yml

      - name: Commit and push the independent copy
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected; target already matches the source."
            exit 0
          fi
          git commit -m "Import complete minimaLinux source and minimaOS upgrade"
          git push origin HEAD:main
