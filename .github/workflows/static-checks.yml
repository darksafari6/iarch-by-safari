name: iArch static checks

on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Bash syntax
        run: |
          set -euo pipefail
          # Every tracked shell script, plus the two launcher scripts that have
          # no shebang (they are executed through /usr/bin/env bash by the
          # Wayland session entry).
          mapfile -t scripts < <(git ls-files '*.sh' | sort)
          scripts+=(legacy/session/minimalinux-session legacy/session/minimalinux-customize)
          printf 'bash -n on %s files\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
            [[ -f "$script" ]] || { echo "missing script: $script" >&2; exit 1; }
            bash -n "$script"
          done

      - name: Run isolated installer and profile tests
        run: |
          set -euo pipefail
          ./tests/session-install.sh
          ./tests/managed-files.sh
          ./tests/package-audit.sh
          ./tests/test_iarch_common.sh
          ./tests/test_uninstall.sh

      - name: Run unit tests (includes the payload map and branding checks)
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate TOML and palette JSON
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          config = Path(".config/noctalia/config.toml")
          palette = Path(".config/noctalia/palettes/iarch-midnight.json")

          parsed = tomllib.loads(config.read_text(encoding="utf-8"))
          colors = json.loads(palette.read_text(encoding="utf-8"))

          assert parsed["theme"]["custom_palette"] == "iarch-midnight"
          assert parsed["shell"]["settings_window_translucent"] is True
          assert parsed["shell"]["panel"]["transparency_mode"] == "glass"
          assert parsed["bar"]["default"]["compositor_blur"] is True
          assert parsed["dock"]["enabled"] is True
          assert parsed["notification"]["enable_daemon"] is True
          assert parsed["audio"]["enable_notification_sounds"] is False

          fields = {
              "mPrimary", "mOnPrimary", "mSecondary", "mOnSecondary",
              "mTertiary", "mOnTertiary", "mError", "mOnError",
              "mSurface", "mOnSurface", "mSurfaceVariant",
              "mOnSurfaceVariant", "mOutline", "mShadow", "mHover", "mOnHover"
          }
          assert set(colors["dark"]) >= fields
          assert set(colors["light"]) >= fields
          for variant in ("dark", "light"):
              for key in fields:
                  value = colors[variant][key]
                  assert isinstance(value, str) and value.startswith("#") and len(value) == 7, (variant, key, value)

          print("TOML parsed; glass profile and both palette variants passed structural checks.")
          PY

      - name: Check keybindings were added without replacing current shortcuts
        run: |
          set -euo pipefail
          grep -F 'SUPER + I' .config/hypr/keybind.lua
          grep -F 'SUPER + SHIFT + N' .config/hypr/keybind.lua
          grep -F 'SUPER + SHIFT + A' .config/hypr/keybind.lua
          grep -F 'SUPER + SHIFT + W' .config/hypr/keybind.lua
          grep -F 'SUPER + SHIFT + B' .config/hypr/keybind.lua

      - name: Check the legacy v4 payload stayed out of the v5 payload
        run: |
          set -euo pipefail
          # The v4-only files live under legacy/config/ now; nothing there may
          # leak into the tree the v5 installer deploys.
          test ! -e .config/hypr/hyprland.conf
          test ! -e .config/noctalia/settings.json
          test -f legacy/config/hypr/hyprland.conf
          test -f legacy/config/noctalia/settings.json
