<?xml version="1.0" encoding="UTF-8"?>
<!--
  iArch by Safari — monochrome logo.
  Original artwork drawn for this repository; it is not derived from any other
  project's mark. Same geometry as iarch-logo.svg, reduced to a single colour so
  it works on any background: `currentColor` follows the surrounding text or UI
  colour, and the tile is a 14% fill with a full-strength outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="iarch-mono-title iarch-mono-desc" fill="currentColor">
  <title id="iarch-mono-title">iArch by Safari</title>
  <desc id="iarch-mono-desc">A rounded square outline in one colour with the letters iA inside.</desc>

  <!-- Glass tile, single colour: translucent body plus a solid rim. -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill-opacity="0.14"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="23.25" ry="23.25"
        fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- "i": dot plus stem. -->
  <circle cx="43" cy="42" r="6.5"/>
  <rect x="36.5" y="55" width="13" height="34" rx="6.5"/>

  <!-- "A": two strokes and a crossbar. -->
  <g fill="none" stroke="currentColor" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 89 L 80.5 40 L 99 89"/>
    <path d="M69.5 72 H 91.5" stroke-width="10"/>
  </g>
</svg>
