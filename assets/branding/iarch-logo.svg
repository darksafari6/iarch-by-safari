<?xml version="1.0" encoding="UTF-8"?>
<!--
  iArch by Safari — primary logo.
  Original artwork drawn for this repository; it is not derived from any other
  project's mark. Rounded glass square, "iA" letterforms, gradient fill and a
  single subtle top highlight.

  Geometry: 128 x 128 viewBox, 24 unit corner radius, 8 unit inner margin.
  Colours come from the iArch Midnight palette so the mark and the desktop agree.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="iarch-title iarch-desc">
  <title id="iarch-title">iArch by Safari</title>
  <desc id="iarch-desc">A rounded glass square in deep indigo with the letters iA and a soft highlight across the top.</desc>

  <defs>
    <!-- Glass body: midnight indigo to a deeper violet, lit from the top left. -->
    <linearGradient id="iarch-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3567"/>
      <stop offset="0.55" stop-color="#1b2145"/>
      <stop offset="1" stop-color="#12162f"/>
    </linearGradient>

    <!-- Letterforms: the accent used by the session's active colours. -->
    <linearGradient id="iarch-mark" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#a8c7ff"/>
      <stop offset="1" stop-color="#6f8fe8"/>
    </linearGradient>

    <!-- One highlight sweep across the upper half, fading out before the middle. -->
    <linearGradient id="iarch-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="iarch-clip">
      <rect x="8" y="8" width="112" height="112" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Glass tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#iarch-body)"/>

  <g clip-path="url(#iarch-clip)">
    <!-- Highlight: an arc across the top, clipped to the tile. -->
    <path d="M8 62 C 34 22, 94 22, 120 62 L 120 8 L 8 8 Z" fill="url(#iarch-gloss)"/>
    <!-- Inner rim light along the top edge only. -->
    <path d="M20 9.5 H 108" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Hairline border so the tile keeps its edge on light backgrounds. -->
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="23.25" ry="23.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- "i": dot plus stem, optically centred left of the A. -->
  <g fill="url(#iarch-mark)">
    <circle cx="43" cy="42" r="6.5"/>
    <rect x="36.5" y="55" width="13" height="34" rx="6.5"/>
  </g>

  <!-- "A": two strokes and a crossbar, drawn as one path for a crisp silhouette. -->
  <g fill="none" stroke="url(#iarch-mark)" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 89 L 80.5 40 L 99 89"/>
    <path d="M69.5 72 H 91.5" stroke-width="10"/>
  </g>
</svg>
